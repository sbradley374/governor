[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-governor"
version = "0.3.0"
description = "A CRT companion with a voice, a face, and a memory."
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
camera = ["opencv-python-headless>=4.10,<5", "numpy>=1.24,<3"]
audio = ["sounddevice>=0.5,<1", "numpy>=1.24,<3"]
wake = ["vosk>=0.3.44,<0.4"]
local = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
governor = "governor.cli:main"

[tool.setuptools.package-data]
governor = ["static/*"]

[tool.setuptools.packages.find]
include = ["governor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
