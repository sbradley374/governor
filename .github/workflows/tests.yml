name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Python tests (no devices or API credentials)
        run: python -m pytest -q
      - name: Renderer regression tests
        run: node --test tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          node --check governor/static/app.js
          node --check governor/static/face.js
          node --check governor/static/ambient.js
          node --check governor/static/workbench.js
          node --check governor/static/room.js
      - name: Installation script syntax
        run: bash -n scripts/*.sh
